[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "product-analytics-data-reliability"
version = "0.37.0"
description = "Product analytics and data reliability workbench with real-world incremental processing, recovery, semantic governance and reproducible decision evidence"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.4,<2",
  "pandas>=2.2,<3",
  "numpy>=2.0,<3",
  "scipy>=1.13,<2",
  "statsmodels>=0.14,<1",
  "openpyxl>=3.1,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
