[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "product-analytics-data-reliability"
version = "0.27.0"
description = "Synthetic product analytics, data reliability and experiment-design workbench"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.4,<2",
  "pandas>=2.2,<3",
  "numpy>=2.0,<3",
  "scipy>=1.13,<2",
  "statsmodels>=0.14,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
