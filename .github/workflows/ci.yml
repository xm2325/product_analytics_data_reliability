name: ci

on:
  push:
  pull_request:

jobs:
  test-and-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Unit tests
        run: pytest -q
      - name: Build v0.35 reference evidence
        run: python scripts/build_reference.py --days 120 --output-dir build/ci-reference
      - name: Validate reference evidence
        run: python scripts/validate_build.py build/ci-reference
      - name: Validate forecast decision plan
        run: python scripts/validate_forecast_plan.py build/ci-reference
      - name: Validate contract migration governance
        run: python scripts/validate_contract_migration.py build/ci-reference
      - name: Build v0.41 downstream evidence invalidation
        run: python scripts/build_evidence_invalidation_reference.py --base-dir build/ci-reference --output-dir build/evidence-invalidation
      - name: Independently validate v0.41 evidence invalidation
        run: python scripts/validate_evidence_invalidation_reference.py --base-dir build/ci-reference --output-dir build/evidence-invalidation
      - name: Build v0.42 selective evidence revalidation
        run: python scripts/build_evidence_revalidation_reference.py --base-dir build/ci-reference --output-dir build/evidence-revalidation
      - name: Independently validate v0.42 evidence revalidation
        run: python scripts/validate_evidence_revalidation_reference.py --base-dir build/ci-reference --output-dir build/evidence-revalidation
      - name: Build v0.43 incident correction and replay evidence
        run: python scripts/build_incident_recovery_reference.py --base-dir build/ci-reference --output-dir build/incident-recovery
      - name: Independently validate v0.43 incident recovery
        run: python scripts/validate_incident_recovery_reference.py --base-dir build/ci-reference --output-dir build/incident-recovery
      - name: Validate watermark backtest
        run: python scripts/validate_watermark_backtest.py build/ci-reference
      - name: Validate uncertainty certification
        run: python scripts/validate_uncertainty_certification.py build/ci-reference
      - name: Validate certification evidence plan
        run: python scripts/validate_evidence_plan.py build/ci-reference
      - name: Validate pricing experiment
        run: python scripts/validate_pricing_experiment.py build/ci-reference
      - name: Validate pricing impact plan
        run: python scripts/validate_impact_plan.py build/ci-reference
      - name: Validate pinned reference claims
        run: python scripts/validate_reference_claims.py build/ci-reference
      - name: Validate checked-in public claim ledger
        run: python scripts/validate_static_claim_ledger.py build/ci-reference
      - name: Show generated evidence inventory
        run: |
          ls -lh build/ci-reference
          ls -lh build/evidence-invalidation
          ls -lh build/evidence-revalidation
          ls -lh build/incident-recovery
          cat build/ci-reference/forecast_contract.json
          cat build/ci-reference/forecast_evaluations.csv
          cat build/ci-reference/migration_decisions.json
          cat build/ci-reference/metric_change_impact.csv
          cat build/ci-reference/migration_forecast_impact.csv
          cat build/evidence-invalidation/evidence_invalidation_summary.csv
          cat build/evidence-invalidation/evidence_invalidation_evidence.json
          cat build/evidence-revalidation/evidence_revalidation_summary.csv
          cat build/evidence-revalidation/evidence_revalidation_evidence.json
          cat build/incident-recovery/incident_recovery_summary.csv
          cat build/incident-recovery/decision_supersession_ledger.csv
          cat build/incident-recovery/incident_recovery_evidence.json
          cat build/ci-reference/quality_report.json
          cat build/ci-reference/pricing_experiment_decision.json
          cat build/ci-reference/pricing_guardrail_evidence_plan.json
          cat build/ci-reference/pricing_impact_decision.json
          cat build/ci-reference/watermark_policy_decision.json
          cat build/ci-reference/watermark_stability_decision.json
          cat build/ci-reference/watermark_certification_decision.json
          cat build/ci-reference/watermark_evidence_plan_decision.json
          cat build/ci-reference/MANIFEST.json
      - name: Upload validated reference evidence
        uses: actions/upload-artifact@v4
        with:
          name: reference-evidence
          path: |
            build/ci-reference/*.csv
            build/ci-reference/*.json
            build/ci-reference/*.duckdb
            build/evidence-invalidation/*.csv
            build/evidence-invalidation/*.json
            build/evidence-revalidation/*.csv
            build/evidence-revalidation/*.json
            build/incident-recovery/*.csv
            build/incident-recovery/*.json
          if-no-files-found: error
          retention-days: 30
